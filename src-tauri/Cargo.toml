[package]
name = "null-notes"
version = "0.1.0"
description = "A WYSIWYG Markdown note app with inline ink and a PDF import pipeline"
authors = ["Torres"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "null_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = "0.24"
tempfile = "3"
pdfium-render = { version = "0.9", optional = true }
notify = "8.2.0"
base64 = "0.22"
unicode-normalization = "0.1.25"
random_word = { version = "0.5", features = ["de", "en"] }
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

[features]
default = ["pdf-native"]
pdf-native = ["pdfium-render"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

