[package]
name = "null-notes"
version = "0.1.1"
description = "A WYSIWYG Markdown note app with inline ink and a PDF import pipeline"
authors = ["Torres"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "null_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.1", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = "0.24"
tempfile = "3"
pdfium-render = { version = "0.9", optional = true }
notify = "8.2.0"
base64 = "0.22"
unicode-normalization = "0.1.25"
random_word = { version = "0.5", features = ["de", "en"] }
portable-pty = "0.9.0"
gix = { version = "0.87.1", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "credentials",
    "revision",
    "index",
    "worktree-mutation",
    "blob-diff",
    "sha1",
    "merge",
] }
gix-pack = { version = "0.74.2", default-features = false, features = ["generate"] }
gix-object = { version = "0.64.1", default-features = false }
gix-zlib = { version = "0.1.0", default-features = false }
gix-transport = { version = "0.59.2", default-features = false, features = ["blocking-client"] }
gix-protocol = { version = "0.65.1", default-features = false, features = ["blocking-client"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = "4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Graphics_Printing",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
] }

[features]
default = ["pdf-native"]
pdf-native = ["pdfium-render"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

