[package]
name = "null-notes-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
serde_yaml_ng = "0.10"

[workspace]

[[bin]]
name = "fts_query"
path = "fuzz_targets/fts_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "properties"
path = "fuzz_targets/properties.rs"
test = false
doc = false
bench = false
