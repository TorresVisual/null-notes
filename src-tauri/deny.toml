[advisories]
ignore = [
    # quick-xml pinned ^0.39.2 transitively via tauri -> plist
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # unmaintained, no replacement: paste via random_word, proc-macro-error and
    # unsafe-libyaml/zbus/zvariant transitively via tauri and serde_yaml deps
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
