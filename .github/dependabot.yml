version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri/cli
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri/context-menu-handler
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
