name: AltStore source

# Adds a published release's .ipa to altstore.json, which AltStore reads from
# the permanent `altstore` pre-release (main is protected, so the file can't be
# committed from CI). Called by release.yml after publish, so the source never
# lists an asset that 404s; run it by hand to redo a tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re-)add, e.g. v1.0.12
        required: true
        type: string

concurrency: altstore-source

jobs:
  altstore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Add the ipa to altstore.json
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets,body > release.json
          ipa=$(jq -r '[.assets[] | select(.name | endswith(".ipa"))][0].name // empty' release.json)
          [ -n "$ipa" ] || { echo "release has no ipa; AltStore source unchanged"; exit 0; }
          jq -r .body release.json > notes.md
          size=$(jq -r --arg n "$ipa" '.assets[] | select(.name == $n) | .size' release.json)
          if ! gh release view altstore >/dev/null 2>&1; then
            gh release create altstore --prerelease --latest=false --target main \
              --title "AltStore source" \
              --notes "Hosts altstore.json for the AltStore source. Maintained by altstore-source.yml."
          fi
          gh release download altstore --pattern altstore.json --output altstore.json --clobber \
            || echo '{"apps":[{"versions":[]}]}' > altstore.json
          jq --arg raw "https://raw.githubusercontent.com/$GH_REPO/main" --arg v "${TAG#v}" \
             --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg src "https://github.com/$GH_REPO/releases/download/altstore/altstore.json" \
             --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$ipa" \
             --argjson size "$size" --rawfile notes notes.md '
            .name = "Null Notes"
            | .identifier = "dev.nullnotes.source"
            | .sourceURL = $src
            | .apps[0] |= (
                .name = "Null Notes"
                | .bundleIdentifier = "dev.nullnotes.app"
                | .developerName = "TorresVisual"
                | .subtitle = "Markdown notes with ink and PDF import"
                | .localizedDescription = "A WYSIWYG Markdown note-taking app for CS students."
                | .iconURL = "\($raw)/src-tauri/icons/icon.png"
                | .tintColor = "7EE787"
                | .versions = ([{version: $v, date: $date, downloadURL: $url, size: $size,
                                 minOSVersion: "14.0", localizedDescription: $notes}]
                               + (.versions | map(select(.version != $v)))))
          ' altstore.json > altstore.json.new
          mv altstore.json.new altstore.json
          gh release upload altstore altstore.json --clobber
