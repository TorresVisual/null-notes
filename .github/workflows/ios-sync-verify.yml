name: iOS sync verify
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch iOS pdfium binary
        run: |
          set -euo pipefail
          curl -L -o pdfium-ios-sim.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-ios-simulator-arm64.tgz"
          mkdir -p src-tauri/gen/pdfium-ios
          tar -xzf pdfium-ios-sim.tgz -C src-tauri/gen/pdfium-ios
          find src-tauri/gen/pdfium-ios -iname "*pdfium*"
      - name: Copy pdfium smoke-test fixture
        run: cp src-tauri/tests/fixtures/sample.pdf src-tauri/gen/pdfium-smoke-fixture.pdf
      - name: Stand up a local git HTTP remote
        run: |
          set -euo pipefail
          # Seed the bare repo's initial content in a throwaway working copy,
          # then push it into a real bare repo the same way a real "desktop"
          # would have created it — not `git init --bare` with hand-crafted
          # objects, so the fixture is exactly as real as any other repo.
          mkdir -p /tmp/git-http-root
          git init --bare --initial-branch=main /tmp/git-http-root/fixture-remote.git
          git -C /tmp/git-http-root/fixture-remote.git config http.receivepack true

          mkdir -p /tmp/fixture-seed
          git -C /tmp/fixture-seed init --initial-branch=main
          git -C /tmp/fixture-seed config user.name "ci-seed"
          git -C /tmp/fixture-seed config user.email "ci-seed@example.com"
          echo "# Fixture note" > /tmp/fixture-seed/note.md
          git -C /tmp/fixture-seed add note.md
          git -C /tmp/fixture-seed commit -m "seed: fixture note"
          git -C /tmp/fixture-seed push /tmp/git-http-root/fixture-remote.git main

          # git-http-backend is a CGI binary; Python's stdlib CGI HTTP server
          # execs it with the right CGI env vars set, no new dependency needed
          # on a runner that already ships git and python3.
          mkdir -p /tmp/git-http-root/cgi-bin
          cp "$(git --exec-path)/git-http-backend" /tmp/git-http-root/cgi-bin/
          (
            cd /tmp/git-http-root
            GIT_HTTP_EXPORT_ALL=1 GIT_PROJECT_ROOT=/tmp/git-http-root \
              python3 -m http.server --cgi 8080 &
            echo $! > /tmp/git-http-server.pid
          )
          sleep 1

          # Python's CGIHTTPRequestHandler only execs a script for paths under
          # a cgi_directories entry (default "/cgi-bin"); it appends whatever
          # follows the script name as PATH_INFO, which git-http-backend uses
          # (with GIT_PROJECT_ROOT) to locate the repo. A URL with no
          # /cgi-bin/git-http-backend/ prefix is served as a static-file
          # lookup instead — 404, which git reports as "repository not found".
          echo "FIXTURE_REMOTE_URL=http://127.0.0.1:8080/cgi-bin/git-http-backend/fixture-remote.git" >> "$GITHUB_ENV"
      - name: Sanity-check the local git remote with a real host-side clone
        run: |
          set -euo pipefail
          rm -rf /tmp/sanity-clone
          git clone "$FIXTURE_REMOTE_URL" /tmp/sanity-clone
          test -f /tmp/sanity-clone/note.md
          grep -q "Fixture note" /tmp/sanity-clone/note.md
          echo "smart-HTTP clone: OK"
      - name: Build for iOS Simulator
        run: npx tauri ios build --target aarch64-sim --debug
      - name: Boot Simulator and install
        run: |
          UDID=$(xcrun simctl create nullnotes-ci "iPhone 15")
          xcrun simctl boot "$UDID"
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/debug-iphonesimulator/*.app" | head -n1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 10
          xcrun simctl io "$UDID" screenshot before.png
          xcrun simctl spawn "$UDID" log show --predicate 'process == "null-notes" OR eventMessage CONTAINS "nullnotes"' --last 2m > app.log || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Install idb
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          pip3 install --break-system-packages fb-idb
          idb connect "$UDID"
      - name: Clone the fixture remote through the onboarding form
        run: |
          # Tap only the URL field, at the pre-keyboard layout (points, from a
          # CI screenshot): the keyboard shifts everything afterwards. Tab
          # (HID 43) then reaches the token field. Return (HID 40) did not
          # submit the form (run 38180844649), so the button is tapped at its
          # keyboard-open position.
          # Tab alone fails with nothing focused (run 38180210398).
          idb ui tap --udid "$UDID" 196 585
          idb ui text --udid "$UDID" "$FIXTURE_REMOTE_URL"
          idb ui key --udid "$UDID" 43
          idb ui text --udid "$UDID" "dummy-token-for-ci"
          xcrun simctl io "$UDID" screenshot clone-filled.png
          idb ui tap --udid "$UDID" 196 663
          sleep 3
          xcrun simctl io "$UDID" screenshot clone-progress.png
          sleep 8
          xcrun simctl io "$UDID" screenshot clone-success.png
          idb ui describe-all --udid "$UDID" > ax-clone.json || true
      - name: Read the cloned note off the device
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          NOTE_PATH=$(find "$APP_DATA" -iname "note.md" -not -path "*/.git/*" | head -n1)
          if [ -z "$NOTE_PATH" ]; then
            echo "note.md not found in the data container"
            find "$APP_DATA" -maxdepth 4 -not -path "*/Library/*"
            exit 1
          fi
          echo "Found at: $NOTE_PATH"
          grep -q "Fixture note" "$NOTE_PATH"
          echo "on-device clone content: OK"
      - name: Open the note and try editing it (exploratory tap positions)
        if: always()
        run: |
          # Positions are guesses from run 38182288140's dashboard screenshot;
          # the markers typed at each y show on disk which tap reached the editor.
          idb ui tap --udid "$UDID" 79 356
          sleep 3
          xcrun simctl io "$UDID" screenshot note-open.png
          idb ui describe-all --udid "$UDID" > ax-note.json || true
          for y in 200 260 320; do
            idb ui tap --udid "$UDID" 120 "$y"
            idb ui text --udid "$UDID" " m$y"
            sleep 1
          done
          sleep 2
          xcrun simctl io "$UDID" screenshot after-edit.png
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          NOTE_PATH=$(find "$APP_DATA" -iname "note.md" -not -path "*/.git/*" | head -n1)
          echo "--- note.md on device ---"
          cat "$NOTE_PATH"
      - name: Try Sync now and read the remote with a plain git clone
        if: always()
        run: |
          idb ui tap --udid "$UDID" 330 118
          sleep 8
          xcrun simctl io "$UDID" screenshot after-sync.png
          rm -rf /tmp/verify-push
          git clone "$FIXTURE_REMOTE_URL" /tmp/verify-push
          git -C /tmp/verify-push log --oneline | head -5
          echo "--- remote note.md ---"
          cat /tmp/verify-push/note.md
      - name: Push a desktop-side commit, relaunch, and capture the picker
        if: always()
        run: |
          echo "desktop edit" >> /tmp/verify-push/note.md
          git -C /tmp/verify-push -c user.name=desktop-sim -c user.email=desktop-sim@example.com commit -qam "desktop: further edit"
          git -C /tmp/verify-push push -q origin main
          xcrun simctl terminate "$UDID" dev.nullnotes.app || true
          xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 5
          xcrun simctl io "$UDID" screenshot after-relaunch.png
          idb ui describe-all --udid "$UDID" > ax-relaunch.json || true
      - name: Upload clone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-editor-sync-clone
          path: |
            clone-filled.png
            clone-progress.png
            clone-success.png
            sidebar-open.png
            ax-clone.json
            note-open.png
            after-edit.png
            after-sync.png
            after-relaunch.png
            ax-note.json
            ax-relaunch.json
