name: iOS scaffold
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Fetch iOS pdfium binary
        run: |
          set -euo pipefail
          curl -L -o pdfium-ios-sim.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-ios-simulator-arm64.tgz"
          mkdir -p src-tauri/gen/pdfium-ios
          tar -xzf pdfium-ios-sim.tgz -C src-tauri/gen/pdfium-ios
          find src-tauri/gen/pdfium-ios -iname "*pdfium*"
      - name: Copy pdfium smoke-test fixture
        run: cp src-tauri/tests/fixtures/sample.pdf src-tauri/gen/pdfium-smoke-fixture.pdf
      - name: cargo check (iOS)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim
      - name: cargo clippy (iOS)
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-ios-sim -- -D warnings
      - name: cargo build (desktop, unaffected)
        working-directory: src-tauri
        run: cargo build
      - name: cargo test (git_mobile, native macOS)
        working-directory: src-tauri
        run: "cargo test --lib commands::git_mobile::"
      - name: cargo clippy (desktop)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Build for iOS Simulator
        run: npx tauri ios build --target aarch64-sim --debug
      - name: Boot Simulator and install
        run: |
          UDID=$(xcrun simctl create nullnotes-ci "iPhone 15")
          xcrun simctl boot "$UDID"
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/debug-iphonesimulator/*.app" | head -n1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 10
          xcrun simctl io "$UDID" screenshot before.png
          xcrun simctl spawn "$UDID" log show --predicate 'process == "null-notes" OR eventMessage CONTAINS "nullnotes"' --last 2m > app.log || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Locate bundled pdfium relative to the executable
        run: |
          set -euo pipefail
          APP_PATH=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app app)
          echo "App bundle: $APP_PATH"
          echo "--- top-level contents ---"
          ls -la "$APP_PATH"
          echo "--- recursive search for pdfium anywhere in the bundle ---"
          find "$APP_PATH" -iname "*pdfium*" || true
          echo "--- executable path, for comparison ---"
          echo "$APP_PATH/null-notes"
      - name: Relaunch app with the pdfium smoke-test flag
        run: |
          set -euo pipefail
          xcrun simctl terminate "$UDID" dev.nullnotes.app || true
          SIMCTL_CHILD_NULLNOTES_PDFIUM_SMOKE_TEST=1 xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 3
      - name: Read pdfium smoke-test result
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          echo "App data container: $APP_DATA"
          RESULT_PATH=$(find "$APP_DATA" -iname "pdfium_smoke_result.txt" | head -n1)
          if [ -z "$RESULT_PATH" ]; then
            echo "pdfium_smoke_result.txt not found anywhere in the data container"
            echo "--- data container layout (2 levels) ---"
            find "$APP_DATA" -maxdepth 2
            exit 1
          fi
          echo "Found at: $RESULT_PATH"
          cat "$RESULT_PATH" | tee smoke-result.txt
          grep -q "^PASS" smoke-result.txt
      - name: Install idb and send a synthetic tap
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          pip3 install --break-system-packages fb-idb
          idb connect "$UDID"
          idb ui describe-all --udid "$UDID" > ax-tree.json || true
          # idb's tap coordinates are in UIKit points (device logical size,
          # e.g. 393x852 for iPhone 15), not the screenshot's raw pixels
          # (which are 3x that) -- computed from before.png against the
          # sidebar "Note" button; ax-tree.json is captured above to correct
          # this if the computed guess turns out to be off.
          idb ui tap 62 193 --udid "$UDID"
          sleep 1
          xcrun simctl io "$UDID" screenshot after.png
      - name: Screenshot onboarding form
        run: xcrun simctl io "$UDID" screenshot onboarding-before.png
      - name: Tap the URL field and type
        run: |
          idb ui tap --udid "$UDID" 320 605
          idb ui text --udid "$UDID" "https://example.com/no-such-repo.git"
      - name: Tap the token field and type
        run: |
          idb ui tap --udid "$UDID" 320 677
          idb ui text --udid "$UDID" "dummy-token-for-ci"
      - name: Tap Clone workspace
        run: idb ui tap --udid "$UDID" 320 726
      - name: Wait for the clone attempt to fail (unreachable host)
        run: sleep 5
      - name: Screenshot the result
        run: xcrun simctl io "$UDID" screenshot onboarding-after.png
      - name: Upload onboarding screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-onboarding-screenshots
          path: |
            onboarding-before.png
            onboarding-after.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-test
          path: |
            before.png
            after.png
            app.log
            ax-tree.json
