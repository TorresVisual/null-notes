name: iOS scaffold
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-ios-sim aarch64-apple-ios
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Fetch iOS pdfium binary
        run: |
          set -euo pipefail
          curl -L -o pdfium-ios-sim.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-ios-simulator-arm64.tgz"
          mkdir -p src-tauri/gen/pdfium-ios
          tar -xzf pdfium-ios-sim.tgz -C src-tauri/gen/pdfium-ios
          find src-tauri/gen/pdfium-ios -iname "*pdfium*"
      - name: Copy pdfium smoke-test fixture
        run: cp src-tauri/tests/fixtures/sample.pdf src-tauri/gen/pdfium-smoke-fixture.pdf
      - name: cargo check (iOS)
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios-sim
      - name: cargo clippy (iOS)
        working-directory: src-tauri
        run: cargo clippy --target aarch64-apple-ios-sim -- -D warnings
      - name: cargo build (desktop, unaffected)
        working-directory: src-tauri
        run: cargo build
      - name: cargo test (git_mobile, native macOS)
        working-directory: src-tauri
        run: "cargo test --lib commands::git_mobile::"
      - name: cargo clippy (desktop)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Stand up a local git HTTP remote
        run: |
          set -euo pipefail
          # Seed the bare repo's initial content in a throwaway working copy,
          # then push it into a real bare repo the same way a real "desktop"
          # would have created it — not `git init --bare` with hand-crafted
          # objects, so the fixture is exactly as real as any other repo.
          mkdir -p /tmp/git-http-root
          git init --bare --initial-branch=main /tmp/git-http-root/fixture-remote.git
          git -C /tmp/git-http-root/fixture-remote.git config http.receivepack true

          mkdir -p /tmp/fixture-seed
          git -C /tmp/fixture-seed init --initial-branch=main
          git -C /tmp/fixture-seed config user.name "ci-seed"
          git -C /tmp/fixture-seed config user.email "ci-seed@example.com"
          echo "# Fixture note" > /tmp/fixture-seed/note.md
          git -C /tmp/fixture-seed add note.md
          git -C /tmp/fixture-seed commit -m "seed: fixture note"
          git -C /tmp/fixture-seed push /tmp/git-http-root/fixture-remote.git main

          # git-http-backend is a CGI binary; Python's stdlib CGI HTTP server
          # execs it with the right CGI env vars set, no new dependency needed
          # on a runner that already ships git and python3.
          mkdir -p /tmp/git-http-root/cgi-bin
          cp "$(git --exec-path)/git-http-backend" /tmp/git-http-root/cgi-bin/
          (
            cd /tmp/git-http-root
            GIT_HTTP_EXPORT_ALL=1 GIT_PROJECT_ROOT=/tmp/git-http-root \
              python3 -m http.server --cgi 8080 &
            echo $! > /tmp/git-http-server.pid
          )
          sleep 1

          # Python's CGIHTTPRequestHandler only execs a script for paths under
          # a cgi_directories entry (default "/cgi-bin"); it appends whatever
          # follows the script name as PATH_INFO, which git-http-backend uses
          # (with GIT_PROJECT_ROOT) to locate the repo. A URL with no
          # /cgi-bin/git-http-backend/ prefix is served as a static-file
          # lookup instead — 404, which git reports as "repository not found".
          echo "FIXTURE_REMOTE_URL=http://127.0.0.1:8080/cgi-bin/git-http-backend/fixture-remote.git" >> "$GITHUB_ENV"
      - name: Sanity-check the local git remote with a real host-side clone
        run: |
          set -euo pipefail
          rm -rf /tmp/sanity-clone
          git clone "$FIXTURE_REMOTE_URL" /tmp/sanity-clone
          test -f /tmp/sanity-clone/note.md
          grep -q "Fixture note" /tmp/sanity-clone/note.md
          echo "smart-HTTP clone: OK"
      - name: Build for iOS Simulator
        run: npx tauri ios build --target aarch64-sim --debug
      - name: Boot Simulator and install
        run: |
          UDID=$(xcrun simctl create nullnotes-ci "iPhone 15")
          xcrun simctl boot "$UDID"
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/debug-iphonesimulator/*.app" | head -n1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 10
          xcrun simctl io "$UDID" screenshot before.png
          xcrun simctl spawn "$UDID" log show --predicate 'process == "null-notes" OR eventMessage CONTAINS "nullnotes"' --last 2m > app.log || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Locate bundled pdfium relative to the executable
        run: |
          set -euo pipefail
          APP_PATH=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app app)
          echo "App bundle: $APP_PATH"
          echo "--- top-level contents ---"
          ls -la "$APP_PATH"
          echo "--- recursive search for pdfium anywhere in the bundle ---"
          find "$APP_PATH" -iname "*pdfium*" || true
          echo "--- executable path, for comparison ---"
          echo "$APP_PATH/null-notes"
      - name: Relaunch app with the pdfium smoke-test flag
        run: |
          set -euo pipefail
          xcrun simctl terminate "$UDID" dev.nullnotes.app || true
          SIMCTL_CHILD_NULLNOTES_PDFIUM_SMOKE_TEST=1 xcrun simctl launch "$UDID" dev.nullnotes.app
          # 3s was enough when only the extract-path thread ran; the added
          # render-path thread does real pdfium rasterization concurrently
          # and needs more wall-clock margin on a shared CI VM.
          sleep 10
      - name: Read pdfium smoke-test result
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          echo "App data container: $APP_DATA"
          RESULT_PATH=$(find "$APP_DATA" -iname "pdfium_smoke_result.txt" | head -n1)
          if [ -z "$RESULT_PATH" ]; then
            echo "pdfium_smoke_result.txt not found anywhere in the data container"
            echo "--- data container layout (2 levels) ---"
            find "$APP_DATA" -maxdepth 2
            echo "--- is the process still alive? ---"
            xcrun simctl spawn "$UDID" launchctl list | grep nullnotes || echo "not found in launchctl list"
            echo "--- recent device log for the app ---"
            xcrun simctl spawn "$UDID" log show --predicate 'process == "null-notes" OR eventMessage CONTAINS "nullnotes"' --last 1m || true
            exit 1
          fi
          echo "Found at: $RESULT_PATH"
          cat "$RESULT_PATH" | tee smoke-result.txt
          grep -q "^PASS" smoke-result.txt
      - name: Read pdfium render smoke-test result
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          RESULT_PATH=$(find "$APP_DATA" -iname "pdfium_render_smoke_result.txt" | head -n1)
          if [ -z "$RESULT_PATH" ]; then
            echo "pdfium_render_smoke_result.txt not found anywhere in the data container"
            echo "--- data container layout (2 levels) ---"
            find "$APP_DATA" -maxdepth 2
            exit 1
          fi
          echo "Found at: $RESULT_PATH"
          cat "$RESULT_PATH" | tee render-smoke-result.txt
          grep -q "^PASS" render-smoke-result.txt
      - name: Pull the rendered page PNG for visual confirmation
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          PNG_PATH=$(find "$APP_DATA" -iname "page-0.png" | head -n1)
          if [ -z "$PNG_PATH" ]; then
            echo "page-0.png not found anywhere in the data container"
            exit 1
          fi
          cp "$PNG_PATH" rendered-page-0.png
      - name: Install idb and send a synthetic tap
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          pip3 install --break-system-packages fb-idb
          idb connect "$UDID"
          idb ui describe-all --udid "$UDID" > ax-tree.json || true
          # idb's tap coordinates are in UIKit points (device logical size,
          # e.g. 393x852 for iPhone 15), not the screenshot's raw pixels
          # (which are 3x that) -- computed from before.png against the
          # sidebar "Note" button; ax-tree.json is captured above to correct
          # this if the computed guess turns out to be off.
          idb ui tap 62 193 --udid "$UDID"
          sleep 1
          xcrun simctl io "$UDID" screenshot after.png
      - name: Screenshot onboarding form
        run: xcrun simctl io "$UDID" screenshot onboarding-before.png
      - name: Tap the URL field and type
        run: |
          idb ui tap --udid "$UDID" 320 605
          idb ui text --udid "$UDID" "https://example.com/no-such-repo.git"
      - name: Tap the token field and type
        run: |
          idb ui tap --udid "$UDID" 320 677
          idb ui text --udid "$UDID" "dummy-token-for-ci"
      - name: Tap Clone workspace
        run: idb ui tap --udid "$UDID" 320 726
      - name: Wait for the clone attempt to fail (unreachable host)
        run: sleep 5
      - name: Screenshot the result
        run: xcrun simctl io "$UDID" screenshot onboarding-after.png
      - name: Relaunch for a fresh onboarding form
        run: |
          xcrun simctl terminate "$UDID" dev.nullnotes.app || true
          xcrun simctl launch "$UDID" dev.nullnotes.app
          sleep 5
      - name: Clone the fixture remote through the onboarding form
        run: |
          # Only the first field is tapped: the keyboard shifts the layout, so
          # later coordinates are unreliable. Tab (HID 43) moves to the token
          # field and Enter (HID 40) submits the form.
          idb ui tap --udid "$UDID" 150 530
          idb ui text --udid "$UDID" "$FIXTURE_REMOTE_URL"
          idb ui key --udid "$UDID" 43
          idb ui text --udid "$UDID" "dummy-token-for-ci"
          xcrun simctl io "$UDID" screenshot clone-filled.png
          idb ui key --udid "$UDID" 40
          sleep 10
          xcrun simctl io "$UDID" screenshot clone-success.png
          idb ui describe-all --udid "$UDID" > ax-clone.json || true
      - name: Read the cloned note off the device
        run: |
          set -euo pipefail
          APP_DATA=$(xcrun simctl get_app_container "$UDID" dev.nullnotes.app data)
          NOTE_PATH=$(find "$APP_DATA" -iname "note.md" -not -path "*/.git/*" | head -n1)
          if [ -z "$NOTE_PATH" ]; then
            echo "note.md not found in the data container"
            find "$APP_DATA" -maxdepth 4 -not -path "*/Library/*"
            exit 1
          fi
          echo "Found at: $NOTE_PATH"
          grep -q "Fixture note" "$NOTE_PATH"
          echo "on-device clone content: OK"
      - name: Tap the sidebar toggle (exploratory, for the next plan task)
        if: always()
        run: |
          idb ui tap --udid "$UDID" 30 81
          sleep 1
          xcrun simctl io "$UDID" screenshot sidebar-open.png
          idb ui describe-all --udid "$UDID" > ax-sidebar.json || true
      - name: Upload clone screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-editor-sync-clone
          path: |
            clone-filled.png
            clone-success.png
            sidebar-open.png
            ax-clone.json
            ax-sidebar.json
      - name: Upload onboarding screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-onboarding-screenshots
          path: |
            onboarding-before.png
            onboarding-after.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke-test
          path: |
            before.png
            after.png
            app.log
            ax-tree.json
      - name: Upload rendered page PNG
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdfium-render-smoke
          path: |
            render-smoke-result.txt
            rendered-page-0.png
