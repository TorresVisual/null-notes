name: Publish update mirror

# Tauri's updater fetches anonymously, which a private repo's release assets
# refuse. Publishing a release here copies it to the public binaries-only repo
# the app's updater endpoint points at.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re-)mirror, e.g. v1.0.5
        required: true

env:
  SOURCE_REPO: TorresVisual/null-notes
  MIRROR_REPO: TorresVisual/null-notes-releases

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir assets
          gh release view "$TAG" --repo "$SOURCE_REPO" --json body --jq .body > notes.md

      - name: Point latest.json at the mirror
        run: |
          sed -i "s#github.com/$SOURCE_REPO/releases/download/#github.com/$MIRROR_REPO/releases/download/#g" assets/latest.json
          grep -q "$MIRROR_REPO" assets/latest.json

      - name: Create or update the mirror release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$MIRROR_REPO" --clobber
            gh release edit "$TAG" --repo "$MIRROR_REPO" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --repo "$MIRROR_REPO" --title "null-notes $TAG" --notes-file notes.md
          fi
