name: Publish update mirror

# Tauri's updater fetches anonymously, which a private repo's release assets
# refuse. Publishing a release here copies it to the public binaries-only repo
# the app's updater endpoint points at.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re-)mirror, e.g. v1.0.5
        required: true

env:
  SOURCE_REPO: TorresVisual/null-notes
  MIRROR_REPO: TorresVisual/null-notes-releases

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir assets
          gh release view "$TAG" --repo "$SOURCE_REPO" --json body --jq .body > notes.md

      - name: Point latest.json at the mirror
        run: |
          sed -i "s#github.com/$SOURCE_REPO/releases/download/#github.com/$MIRROR_REPO/releases/download/#g" assets/latest.json
          grep -q "$MIRROR_REPO" assets/latest.json

      - name: Add a version-less installer name for the README download link
        run: cp assets/*_x64-setup.exe assets/Null-Notes-setup.exe

      - name: Create or update the mirror release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo "$MIRROR_REPO" --clobber
            gh release edit "$TAG" --repo "$MIRROR_REPO" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --repo "$MIRROR_REPO" --title "null-notes $TAG" --notes-file notes.md
          fi

      - name: Add the ipa to the AltStore source
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ipa=$(ls assets/*.ipa 2>/dev/null | head -n1 || true)
          [ -n "$ipa" ] || { echo "release has no ipa; AltStore source unchanged"; exit 0; }
          VERSION="${TAG#v}"
          RAW="https://raw.githubusercontent.com/$MIRROR_REPO/main"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$MIRROR_REPO.git" mirror
          cp src-tauri/icons/icon.png mirror/altstore-icon.png
          [ -f mirror/altstore.json ] || echo '{"apps":[{"versions":[]}]}' > mirror/altstore.json
          jq --arg raw "$RAW" --arg v "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"              --arg url "https://github.com/$MIRROR_REPO/releases/download/$TAG/$(basename "$ipa")"              --argjson size "$(stat -c%s "$ipa")" --rawfile notes notes.md '
            .name = "Null Notes"
            | .identifier = "dev.nullnotes.source"
            | .sourceURL = "\($raw)/altstore.json"
            | .apps[0] |= (
                .name = "Null Notes"
                | .bundleIdentifier = "dev.nullnotes.app"
                | .developerName = "TorresVisual"
                | .subtitle = "Markdown notes with ink and PDF import"
                | .localizedDescription = "A WYSIWYG Markdown note-taking app for CS students."
                | .iconURL = "\($raw)/altstore-icon.png"
                | .tintColor = "7EE787"
                | .versions = ([{version: $v, date: $date, downloadURL: $url, size: $size,
                                 minOSVersion: "14.0", localizedDescription: $notes}]
                               + (.versions | map(select(.version != $v)))))
          ' mirror/altstore.json > mirror/altstore.json.new
          mv mirror/altstore.json.new mirror/altstore.json
          cd mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore.json altstore-icon.png
          git commit -m "altstore: $TAG"
          git push
