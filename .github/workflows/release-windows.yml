name: Release (Windows)

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.0.9 (adds to its draft release, creating it if missing)
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Refuse to build with the updater placeholder key
        shell: bash
        run: |
          if grep -q REPLACE_WITH src-tauri/tauri.conf.json; then
            echo "plugins.updater.pubkey in tauri.conf.json is still a placeholder" >&2
            exit 1
          fi

      - id: draft
        uses: ./.github/actions/ensure-draft
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore pinned signing cert
        env:
          NULL_NOTES_SIGNING_PFX_BASE64: ${{ secrets.NULL_NOTES_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:NULL_NOTES_SIGNING_PFX_BASE64) { throw "Secret NULL_NOTES_SIGNING_PFX_BASE64 is not set - see docs/installing.md" }
          ./scripts/windows/dev-cert.ps1

      - name: Package identity .msix
        run: ./scripts/windows/package-identity.ps1

      - name: Download pdfium.dll
        run: ./scripts/download-pdfium.ps1

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/context-menu-handler
            src-tauri/cli

      - name: Build context-menu-handler DLL
        working-directory: src-tauri/context-menu-handler
        run: cargo build --release

      - name: Build nullnotes CLI
        working-directory: src-tauri/cli
        run: cargo build --release

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.draft.outputs.release-id }}
          args: --config src-tauri/tauri.release.conf.json

      - uses: taiki-e/install-action@cargo-cyclonedx

      # npm sbom rejects the tree over peer-dep ranges (radix wants React <=18), so --legacy-peer-deps.
      - name: SBOMs and checksums
        shell: bash
        run: |
          mkdir provenance
          npm sbom --sbom-format cyclonedx --omit dev --legacy-peer-deps > provenance/null-notes-npm.cdx.json
          for dir in src-tauri src-tauri/cli src-tauri/context-menu-handler; do
            cargo cyclonedx --manifest-path "$dir/Cargo.toml" --format json
            cp "$dir"/*.cdx.json provenance/
          done
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi provenance/
          (cd provenance && sha256sum *.exe *.msi *.cdx.json > SHA256SUMS)

      # Artifact attestations need a public repo (or Enterprise Cloud); on a private one the step would fail the release.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            provenance/*.exe
            provenance/*.msi

      - name: Attach SBOMs and SHA256SUMS to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        run: |
          for f in provenance/*.cdx.json provenance/SHA256SUMS; do
            gh api --method POST -H 'Content-Type: application/octet-stream'               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")"               --input "$f"
          done
