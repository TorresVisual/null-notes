name: Release (iOS)

# Builds an unsigned arm64 .ipa and attaches it to the draft release. AltStore
# signs it on the phone, so nothing here needs an Apple account. Once the
# release is published, altstore-source.yml adds the ipa to the AltStore
# source. macOS minutes bill 10x: skip this target
# with `npm run release -- <bump> --skip ios` when a release doesn't need it.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.0.9 (adds to its draft release, creating it if missing)
        required: true
        type: string

jobs:
  ipa:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/ensure-draft
        with:
          tag: ${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-ios
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Fetch iOS device pdfium binary
        run: |
          set -euo pipefail
          curl -L -o pdfium-ios-device.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7763/pdfium-ios-device-arm64.tgz"
          echo "e43621e6e509fb9b06b94e1158192a3798558ac4f4c11e206a940440229bf03d  pdfium-ios-device.tgz" | shasum -a 256 -c
          mkdir -p src-tauri/gen/pdfium-ios
          tar -xzf pdfium-ios-device.tgz -C src-tauri/gen/pdfium-ios
      - name: Copy pdfium smoke-test fixture
        run: cp src-tauri/tests/fixtures/sample.pdf src-tauri/gen/pdfium-smoke-fixture.pdf
      - name: Build unsigned device archive
        run: |
          set -euo pipefail
          HELP=$(npx tauri ios build --help)
          if echo "$HELP" | grep -q -e "--no-sign" && echo "$HELP" | grep -q -e "--archive-only"; then
            npx tauri ios build --target aarch64 --archive-only --no-sign
            ARCHIVE_PATH=$(find ~/Library/Developer/Xcode/DerivedData src-tauri/gen/apple -name "*.xcarchive" -maxdepth 6 | head -n1)
          else
            npx tauri ios init --ci
            npx tauri ios build --target aarch64 --debug || true
            xcodebuild archive \
              -project src-tauri/gen/apple/null-notes.xcodeproj \
              -scheme null-notes_iOS \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/null-notes.xcarchive" \
              CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
            ARCHIVE_PATH="$RUNNER_TEMP/null-notes.xcarchive"
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
      - name: Package the archive's .app into a plain .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -name "*.app" | head -n1)
          [ -n "$APP_PATH" ] || { echo "no .app under $ARCHIVE_PATH" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr -y "NullNotes-${TAG#v}.ipa" Payload)
          mv "$RUNNER_TEMP/NullNotes-${TAG#v}.ipa" .
          unzip -l "NullNotes-${TAG#v}.ipa" | grep -E "Payload/[^/]+\.app/[^/]+$" | head
      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: NullNotes-*.ipa

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" NullNotes-*.ipa --clobber
