name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI signing cert
        run: ./scripts/windows/dev-cert.ps1

      - name: Package identity .msix
        run: ./scripts/windows/package-identity.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/context-menu-handler

      - name: Build context-menu-handler DLL
        working-directory: src-tauri/context-menu-handler
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'null-notes ${{ github.ref_name }}'
