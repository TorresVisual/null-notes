name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to build with the updater placeholder key
        shell: bash
        run: |
          if grep -q REPLACE_WITH src-tauri/tauri.conf.json; then
            echo "plugins.updater.pubkey in tauri.conf.json is still a placeholder" >&2
            exit 1
          fi

      - name: Release notes from commits
        id: notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo 'body<<NOTES_EOF'
            git log --no-merges --format='- %s' ${prev:+$prev..}"${GITHUB_REF_NAME}" | grep -v '^- chore: release' || true
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore pinned signing cert
        env:
          NULL_NOTES_SIGNING_PFX_BASE64: ${{ secrets.NULL_NOTES_SIGNING_PFX_BASE64 }}
        run: |
          if (-not $env:NULL_NOTES_SIGNING_PFX_BASE64) { throw "Secret NULL_NOTES_SIGNING_PFX_BASE64 is not set - see docs/installing.md" }
          ./scripts/windows/dev-cert.ps1

      - name: Package identity .msix
        run: ./scripts/windows/package-identity.ps1

      - name: Download pdfium.dll
        run: ./scripts/download-pdfium.ps1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/context-menu-handler

      - name: Build context-menu-handler DLL
        working-directory: src-tauri/context-menu-handler
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'null-notes ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json
