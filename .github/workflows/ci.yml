name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        working-directory: src-tauri
        # RUSTSEC-2026-0194/0195 (quick-xml): pinned to ^0.39.2 transitively via
        # tauri -> plist, no fix available until that pin moves.
        # RUSTSEC-2023-0071 (rsa Marvin Attack): advisory itself has no fixed
        # upgrade available yet.
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071