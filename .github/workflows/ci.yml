name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Generate CI signing cert
        run: ./scripts/windows/dev-cert.ps1

      - name: Package identity .msix
        run: ./scripts/windows/package-identity.ps1

      - name: Download pdfium.dll
        run: ./scripts/download-pdfium.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/context-menu-handler
            src-tauri/cli

      - name: Build context-menu-handler DLL
        working-directory: src-tauri/context-menu-handler
        run: cargo build --release

      - name: Build nullnotes CLI
        working-directory: src-tauri/cli
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        working-directory: src-tauri
        # RUSTSEC-2026-0194/0195 (quick-xml): pinned to ^0.39.2 transitively via
        # tauri -> plist, no fix available until that pin moves.
        # RUSTSEC-2023-0071 (rsa Marvin Attack): advisory itself has no fixed
        # upgrade available yet.
        # RUSTSEC-2026-0367/0368/0369 (zip 4.6.1): Unix SUID/symlink/permission
        # handling in extract(); the updater only uses zip on Windows, and it is
        # pinned by tauri-plugin-updater 2.x (fix needs zip >=9, no 2.x release).
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369