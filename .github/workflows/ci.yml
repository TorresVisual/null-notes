name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # windows-latest, not ubuntu: this is a Windows-primary desktop app —
    # portable-pty's ConPTY backend and the Windows-path handling scattered
    # through the storage layer only get meaningfully exercised here.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tauri-build's build script expects frontendDist to exist even for a
      # debug-profile build that never embeds it (it only reads devUrl at
      # runtime) — a fresh checkout has no dist/ at all since it's gitignored.
      - run: npm run build

      - run: npm run typecheck
      - run: npm test

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt

      # Formatting is pure whitespace/style with no semantic risk, so it's
      # safe to auto-fix and push. Clippy stays a hard failure below —
      # `--fix` can change behavior, not just style, so that one needs a
      # human. `[skip ci]` in the message stops the push from re-triggering
      # this workflow; scoped to `push` since a pull_request run (possibly
      # from a fork) may not hold a token with push rights.
      - name: Commit formatting fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- src-tauri
          if ! git diff --staged --quiet; then
            git commit -m "style: cargo fmt [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
